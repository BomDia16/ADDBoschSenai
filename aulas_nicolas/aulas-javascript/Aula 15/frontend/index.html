<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-end</title>
</head>
<body>
    <form method="post" id="form">
        <input type="text" name="nome" id="nome" placeholder="Nome">
        <input type="email" name="email" id="email" placeholder="Email">
        <button type="submit">Registrar</button>
    </form>

    <br><br><br>
    
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaUsuarios">
            <!-- Conteúdo da tabela -->
        </tbody>
    </table>

    <br><br><br>

    <form method="post" id="form_atualizar">
        <input type="text" name="nome" id="nome_atualizar" placeholder="Nome">
        <input type="email" name="email" id="email_atualizar" placeholder="Email">
        <button type="submit">Atualizar</button>
    </form>

    <script src="scripts/index.js"></script>
</body>
</html>
