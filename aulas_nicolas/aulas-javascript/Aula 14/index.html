<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleh</title>
</head>
<body>

    <div style="height: 500px; width: 500px">
        <canvas style="height: 500px;" id="myChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>

        const dados = [
            {nome: 'feijao', valor: 7},
            {nome: 'arroz', valor: 10}
        ]

        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
            labels: dados.map(p => {
                return p.nome
            }, []),
            datasets: [{
                label: 'Valores',
                data: dados.map(p => {
                    return p.valor
                }, []),
                borderWidth: 1
            }]
            },
            options: {
                scales: {
                    y: {
                    beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
