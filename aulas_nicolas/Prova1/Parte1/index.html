<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Análise de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- eu sei que está feio, mas está funcionando -->
    <div class="container">
        <nav>
            <h1>
                Painel de Análise de Produtos
            </h1>
        </nav>

        <div class="div-form">
            <input placeholder="Nome" id="nome" type="text">
            <input placeholder="Preço" id="preco" type="text">
            <input placeholder="Quantidade" id="quantidade" type="text">
            <button onclick="adicionarProduto()" type="submit">Adicionar Produto</button>
        </div>

        <div class="cards">
            <div class="card" style="background-color: rgb(0, 218, 0);">
                <div class="card-header" style="background-color: rgb(3, 189, 3);">
                    <h1>Produto mais caro</h1>
                </div>
                <div class="card-body">
                    <h1 id="maisCaro"></h1>
                </div>
            </div>

            <div class="card">
                <div class="card" style="background-color: rgb(255, 149, 28);">
                    <div class="card-header" style="background-color: rgb(190, 129, 14);">
                        <h1>Prod. com maior quantidade</h1>
                    </div>
                    <div class="card-body">
                        <h1 id="maiorQuantidade"></h1>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card" style="background-color: rgb(28, 145, 255);">
                    <div class="card-header" style="background-color: rgb(25, 124, 216);">
                        <h1>Valor total em estoque</h1>
                    </div>
                    <div class="card-body">
                        <h1 id="valorTotal"></h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
